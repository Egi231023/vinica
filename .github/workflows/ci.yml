name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, content audit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The rules of the book, enforced: an unsourced fact, a dangling or
      # orphaned source, a wine claiming a photograph it does not have, or a
      # pin outside Canada all fail here.
      - name: Content audit
        run: npm run audit:content

      - name: Build
        run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start the server
        run: |
          npx next start -p 3300 &
          npx --yes wait-on@7 http://127.0.0.1:3300 --timeout 90000

      - name: Walk the book
        run: node scripts/smoke.mjs
        env:
          BASE: http://127.0.0.1:3300
